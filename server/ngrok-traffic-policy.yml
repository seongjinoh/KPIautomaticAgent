on_http_request:
  - actions:
      - type: add-headers
        config:
          headers:
            ngrok-skip-browser-warning: "1"
on_http_response:
  - actions:
      - type: add-headers
        config:
          headers:
            Access-Control-Allow-Origin: "*"
            Access-Control-Allow-Methods: "GET, POST, PUT, DELETE, OPTIONS"
            Access-Control-Allow-Headers: "Content-Type, ngrok-skip-browser-warning"
